autoUpdate:
  enabled: false
sessions:
  nodeName: laptop
  tailscaleServe: false
run:
  - name: dev
    server: true
    port: 5173
    command: sh
    args:
      - -c
      - |
        echo "> sandbox@1.0.0 dev"
        echo "> vite"
        echo
        echo "  VITE v7.1.4  ready in 312 ms"
        echo
        echo "  ➜  Local:   http://localhost:5173/"
        echo "  ➜  Network: use --host to expose"
        sleep 3600
